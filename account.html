<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Hielke AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/webp" href="favicon.webp">
    <script src="site.js" defer></script>
    <script src="account.js" defer></script>
</head>
<body>
    <header>
        <div class="site-bar">
            <a class="site-brand" href="index.html"><span>hielke ai</span></a>
            <button class="theme-toggle" id="theme-toggle" type="button">☾ dark mode</button>
        </div>
        <h1>account sync</h1>
    </header>
    <nav>
        <a href="index.html">home</a>
        <a href="projects.html">projects</a>
        <a href="account.html" aria-current="page">accounts</a>
        <a href="https://discord.gg/SYGz4ZTkTZ">discord</a>
    </nav>
    <main class="dashboard">
        <section id="login-panel" class="panel">
            <h2>sign in with your bot account</h2>
            <p>Use your numeric Discord user ID and the same master password used by the Hielke AI bot.</p>
            <form id="account-login-form">
                <label for="discord-id">Discord user ID</label>
                <input id="discord-id" inputmode="numeric" autocomplete="off" pattern="[0-9]+" required>
                <label for="master-password">Master password</label>
                <input id="master-password" type="password" autocomplete="current-password">
                <button type="submit">sync accounts</button>
                <p id="login-message" class="form-message" role="alert" hidden></p>
            </form>
        </section>

        <section id="account-panel" hidden>
            <div class="dashboard-heading">
                <div><p class="eyebrow">connected to the bot database</p><h2>your accounts</h2></div>
                <button id="logout-button" class="secondary-button" type="button">sign out</button>
            </div>
            <p id="account-summary" class="integration-note"></p>

            <section class="panel">
                <h2>add a saved account</h2>
                <form id="saved-account-form">
                    <label for="platform">Platform</label>
                    <select id="platform" required>
                        <option value="sparx_maths">Sparx Maths</option>
                        <option value="sparx_reader">Sparx Reader</option>
                        <option value="sparx_science">Sparx Science</option>
                        <option value="drfrost">Dr Frost</option>
                        <option value="educake">Educake</option>
                        <option value="seneca">Seneca</option>
                        <option value="purplemash">Purple Mash</option>
                    </select>
                    <label><input id="cookie-login" type="checkbox"> Cookie login</label>
                    <div id="credential-fields">
                        <label for="username">Username / email</label>
                        <input id="username">
                        <label for="password">Password</label>
                        <input id="password" type="password">
                        <label for="school">School (if required)</label>
                        <input id="school">
                    </div>
                    <div id="cookie-field" hidden>
                        <label for="cookie">Cookie</label>
                        <textarea id="cookie" rows="4"></textarea>
                    </div>
                    <button type="submit">save account</button>
                    <p id="save-message" class="form-message" role="alert" hidden></p>
                </form>
            </section>

            <section class="panel">
                <h2>saved accounts</h2>
                <div id="saved-accounts" class="account-list"></div>
            </section>

            <section class="panel">
                <h2>main accounts</h2>
                <div id="main-accounts" class="account-list"></div>
            </section>
        </section>
    </main>
</body>
</html>
