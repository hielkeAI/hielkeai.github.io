<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment - no more sparx!!!</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/webp" href="favicon.webp">
    <script src="payment.js" defer></script>
</head>
<body>
    <header>
        <h1>payment</h1>
    </header>

    <nav>
        <a href="index.html">home</a>
        <a href="about.html">about</a>
        <a href="links.html">links</a>
        <a href="contact.html">contact</a>
        <a href="projects.html">projects</a>
        <a href="sparx.html">sparx</a>
        <a href="dashboard.html">dashboard</a>
        <a href="payment.html">payment</a>
        <a href="https://discord.gg/SYGz4ZTkTZ">discord</a>
        <a href="https://chat.mistral.ai">mistral</a>
    </nav>

    <main class="dashboard">
        <p class="demo-notice"><strong>Demo only:</strong> checkout is not connected, and these buttons will not take or record a payment.</p>

        <section class="panel" aria-labelledby="payment-heading">
            <h2 id="payment-heading">choose an amount</h2>
            <div class="payment-options">
                <article class="stat-card">
                    <h3>standard sale</h3>
                    <p class="stat-value">£5.00</p>
                    <button class="payment-button" type="button" data-amount="5">continue</button>
                </article>
                <article class="stat-card">
                    <h3>small sale</h3>
                    <p class="stat-value">£2.50</p>
                    <button class="payment-button" type="button" data-amount="2.5">continue</button>
                </article>
            </div>
            <p id="payment-message" class="form-message" role="status" aria-live="polite" hidden></p>
        </section>
    </main>

    <footer>
        <p>last updated: 2026</p>
    </footer>
</body>
</html>
